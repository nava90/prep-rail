<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prep Rail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ECE9E0;
    --paper-card: #F8F6F0;
    --ink: #26251F;
    --ink-soft: #6B6A5E;
    --rule: #CFC9B8;
    --urgent: #B23A22;
    --urgent-bg: #F3E1DA;
    --medium: #B4791E;
    --medium-bg: #F3E6CD;
    --done: #4B6B44;
    --done-bg: #E1E8DC;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1C1B17;
      --paper-card: #26251F;
      --ink: #ECE9E0;
      --ink-soft: #9C9A8C;
      --rule: #45443A;
      --urgent-bg: #3A241D;
      --medium-bg: #3A2F1A;
      --done-bg: #23301F;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1C1B17;
    --paper-card: #26251F;
    --ink: #ECE9E0;
    --ink-soft: #9C9A8C;
    --rule: #45443A;
    --urgent-bg: #3A241D;
    --medium-bg: #3A2F1A;
    --done-bg: #23301F;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
  }
  * { -webkit-tap-highlight-color: transparent; }
  body {
    display: flex;
    justify-content: center;
    min-height: 100%;
  }
  .phone {
    width: 100%;
    max-width: 420px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 22px 20px 0;
    border-bottom: 1px solid var(--rule);
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--paper);
    z-index: 5;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .sub {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 0 0 14px;
  }
  .tabs {
    display: flex;
    gap: 2px;
  }
  .tab {
    flex: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.01em;
    padding: 10px 4px;
    text-align: center;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }
  main {
    flex: 1;
    padding: 14px 16px 90px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-x: auto;
  }
  main.hidden { display: none; }
  .ticket {
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-left: 6px solid var(--rule);
    padding: 14px 14px 14px 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .ticket.level-high { border-left-color: var(--urgent); }
  .ticket.level-med { border-left-color: var(--medium); }
  .ticket.level-low { border-left-color: var(--done); }
  .ticket.checked { opacity: 0.55; }
  .check {
    flex: none;
    width: 26px;
    height: 26px;
    border: 2px solid var(--ink);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink);
    padding: 0;
    margin-top: 1px;
  }
  .check svg { width: 15px; height: 15px; display: none; }
  .ticket.checked .check { background: var(--ink); }
  .ticket.checked .check svg { display: block; stroke: var(--paper-card); }
  .ticket-body { flex: 1; min-width: 0; }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .item-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }
  .ticket.checked .item-name { text-decoration: line-through; }
  .score-tag {
    font-size: 11px;
    padding: 2px 6px;
    white-space: nowrap;
    flex: none;
  }
  .level-high .score-tag { background: var(--urgent-bg); color: var(--urgent); }
  .level-med .score-tag { background: var(--medium-bg); color: var(--medium); }
  .level-low .score-tag { background: var(--done-bg); color: var(--done); }
  .reason {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  .note-toggle {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink-soft);
    text-decoration: underline;
    padding: 6px 0 0;
    cursor: pointer;
  }
  .note-field {
    display: none;
    margin-top: 8px;
  }
  .note-field.open { display: block; }
  .note-field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 12px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 8px;
    resize: none;
    box-sizing: border-box;
  }
  .note-saved {
    font-size: 11px;
    color: var(--done);
    margin-top: 4px;
    display: none;
  }
  .note-saved.show { display: block; }
  .excluded-block {
    margin-top: 6px;
    padding: 12px 14px;
    border: 1px dashed var(--rule);
    color: var(--ink-soft);
    font-size: 12px;
    line-height: 1.5;
  }
  .excluded-block b { color: var(--ink); font-weight: 600; }
  footer {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 420px;
    padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    background: var(--paper);
    border-top: 1px solid var(--rule);
  }
  footer.hidden { display: none; }
  #endshift {
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.01em;
    padding: 13px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
  }
  #endshift:active { opacity: 0.85; }
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 100%;
    max-width: 420px;
    background: var(--paper-card);
    border-top: 1px solid var(--rule);
    padding: 20px 18px calc(20px + env(safe-area-inset-bottom, 0px));
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    margin: 0 0 4px;
  }
  .modal p { font-size: 12px; color: var(--ink-soft); margin: 0 0 14px; }
  .modal-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 13px;
  }
  .modal-item:last-of-type { border-bottom: none; }
  .modal-item button {
    font-family: inherit;
    font-size: 11px;
    padding: 5px 9px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .modal-close {
    margin-top: 14px;
    width: 100%;
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    font-family: inherit;
    font-size: 12px;
    padding: 10px;
    cursor: pointer;
  }
  .all-done { font-size: 13px; color: var(--done); padding: 6px 0; }
  .modal-item { flex-wrap: wrap; gap: 8px; }
  .modal-item textarea {
    flex-basis: 100%;
    width: 100%;
    font-family: inherit;
    font-size: 12px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 8px;
    resize: none;
    box-sizing: border-box;
  }
  .modal-item textarea.needs-note { border-color: var(--urgent); }
  .signoff-hint {
    font-size: 11px;
    color: var(--urgent);
    margin: 0 0 10px;
    display: none;
  }
  .signoff-hint.show { display: block; }

  /* Agent tab */
  .agent-status {
    font-size: 11px;
    color: var(--ink-soft);
    border: 1px dashed var(--rule);
    padding: 8px 10px;
    line-height: 1.5;
  }
  .agent-status.live { color: var(--done); border-color: var(--done); }
  .agent-status.fallback { color: var(--medium); border-color: var(--medium); }
  #readNotesBtn {
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 13px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
  }
  #readNotesBtn:disabled { background: var(--rule); color: var(--ink-soft); cursor: not-allowed; }
  .suggest-card {
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-left: 6px solid var(--medium);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .suggest-card.none { border-left-color: var(--rule); }
  .suggest-card .name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; }
  .suggest-card .quote {
    font-size: 12px;
    color: var(--ink);
    padding-left: 8px;
    border-left: 2px solid var(--rule);
  }
  .suggest-card .change { font-size: 12px; }
  .suggest-card .why { font-size: 11px; color: var(--ink-soft); }
  .suggest-actions { display: flex; gap: 8px; margin-top: 2px; }
  .suggest-actions button {
    flex: 1;
    font-family: inherit;
    font-size: 12px;
    padding: 9px;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .suggest-actions button.primary { background: var(--ink); color: var(--paper); }
  .adjusted-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
  }
  .adjusted-row:last-child { border-bottom: none; }
  .adjusted-row button {
    font-family: inherit;
    font-size: 11px;
    padding: 4px 8px;
    border: 1px solid var(--rule);
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    flex: none;
  }
  .tag-adjusted { color: var(--medium); }

  /* Customer agent */
  .pane-switch { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); }
  .pane-switch button {
    flex: 1;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 12px;
    padding: 9px 4px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .pane-switch button.active { color: var(--ink); border-bottom-color: var(--ink); }
  .chat-log { display: flex; flex-direction: column; gap: 8px; }
  .bubble {
    font-size: 12px;
    line-height: 1.55;
    padding: 10px 12px;
    border: 1px solid var(--rule);
    background: var(--paper-card);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .bubble.user { border-left: 6px solid var(--ink); }
  .bubble.assistant { border-left: 6px solid var(--done); }
  .bubble .who {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .chat-input { display: flex; flex-direction: column; gap: 8px; }
  .chat-input textarea, .count-note {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    background: var(--paper-card);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 9px;
    resize: none;
    box-sizing: border-box;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button {
    font-family: inherit;
    font-size: 11px;
    padding: 6px 9px;
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    cursor: pointer;
    text-align: left;
  }
  .wide-btn {
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 11px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
  }
  .wide-btn.ghost { background: none; color: var(--ink); border: 1px solid var(--ink); }
  .wide-btn:disabled { background: var(--rule); color: var(--ink-soft); border-color: var(--rule); cursor: not-allowed; }
  .count-form { display: flex; flex-direction: column; gap: 8px; }
  .count-form .field-row { margin-bottom: 0; }
  .form-msg { font-size: 11px; color: var(--ink-soft); margin: 0; min-height: 14px; }
  .form-msg.err { color: var(--urgent); }
  .count-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .count-table th, .count-table td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--rule); }
  .count-table th { font-weight: 500; color: var(--ink-soft); font-size: 11px; }
  .count-table td.num, .count-table th.num { text-align: right; }
  .count-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
  }
  .count-row:last-child { border-bottom: none; }
  .count-row .c-note { color: var(--ink-soft); font-size: 11px; display: block; overflow-wrap: anywhere; }
  .count-row button {
    font-family: inherit;
    font-size: 11px;
    padding: 4px 8px;
    border: 1px solid var(--rule);
    background: none;
    color: var(--ink-soft);
    cursor: pointer;
    flex: none;
  }
  .demo-tag { color: var(--medium); }
  .weather-status { font-size: 13px; color: var(--muted, #6b6b6b); margin: 0 0 6px; }
  .w-line { font-size: 15px; padding: 3px 0; }
  .weather-banner {
    margin-top: 8px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--medium); font-size: 14px; font-weight: 600;
  }

  .signoff {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
  }
  .signoff label {
    display: block;
    font-size: 11px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .signoff input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    background: var(--paper);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 10px;
    box-sizing: border-box;
    margin-bottom: 10px;
  }
  #signoffBtn {
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 11px;
    background: var(--done);
    color: var(--paper-card);
    border: none;
    cursor: pointer;
  }
  #signoffBtn:disabled {
    background: var(--rule);
    color: var(--ink-soft);
    cursor: not-allowed;
  }
  .signoff-confirmed {
    display: none;
    font-size: 12px;
    color: var(--done);
    padding: 10px 0;
    text-align: center;
  }
  .signoff-confirmed.show { display: block; }
  .signoff-banner {
    background: var(--done-bg);
    border: 1px solid var(--done);
    color: var(--done);
    padding: 10px 14px;
    font-size: 12px;
  }

  /* Header menu button */
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .menu-btn {
    flex: none;
    width: 34px;
    height: 34px;
    background: none;
    border: 1px solid var(--rule);
    color: var(--ink);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .menu-btn svg { width: 16px; height: 16px; }

  /* Sidebar */
  .sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 30;
  }
  .sidebar-backdrop.open { display: block; }
  .sidebar {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: 86%;
    max-width: 340px;
    background: var(--paper);
    border-right: 1px solid var(--rule);
    padding: calc(20px + env(safe-area-inset-top, 0px)) 18px calc(20px + env(safe-area-inset-bottom, 0px));
    overflow-y: auto;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    z-index: 31;
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    margin: 0 0 4px;
  }
  .sidebar .sub-label {
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }
  .sidebar-section {
    border-top: 1px solid var(--rule);
    padding-top: 14px;
    margin-top: 14px;
  }
  .sidebar-section:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }
  .field-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .field-col { flex: 1; min-width: 0; }
  .field-col label {
    display: block;
    font-size: 10px;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field-col input {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    background: var(--paper-card);
    border: 1px solid var(--rule);
    color: var(--ink);
    padding: 8px;
    box-sizing: border-box;
  }
  .current-shift-box {
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-left: 6px solid var(--medium);
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .current-shift-box b { font-family: 'Space Grotesk', sans-serif; }
  .overdue-flag { color: var(--urgent); font-weight: 600; }
  #startShiftBtn {
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 11px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    margin-top: 2px;
  }
  .history-row {
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 12px;
  }
  .history-row:last-child { border-bottom: none; }
  .history-row .h-top {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
  }
  .history-row .h-meta {
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .history-empty {
    font-size: 12px;
    color: var(--ink-soft);
  }

  /* Next-shift handoff view */
  .section-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink-soft);
    margin: 4px 0 0;
  }
  .handoff-row {
    background: var(--paper-card);
    border: 1px solid var(--rule);
    border-left: 6px solid var(--rule);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .handoff-row.done { border-left-color: var(--done); }
  .handoff-row.open { border-left-color: var(--urgent); }
  .handoff-row .name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 15px;
  }
  .handoff-row .meta {
    font-size: 11px;
    color: var(--ink-soft);
  }
  .handoff-row .note {
    font-size: 12px;
    color: var(--ink);
    margin-top: 4px;
    padding-top: 6px;
    border-top: 1px dashed var(--rule);
  }
  .handoff-empty {
    font-size: 12px;
    color: var(--ink-soft);
    padding: 4px 0;
  }
  .summary-strip {
    display: flex;
    gap: 8px;
  }
  .summary-cell {
    flex: 1;
    border: 1px solid var(--rule);
    padding: 10px 10px;
    text-align: center;
  }
  .summary-cell .num {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    display: block;
  }
  .summary-cell .lbl {
    font-size: 10px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div class="header-top">
      <div>
        <p class="kicker">TODAY · PREP RAIL</p>
        <h1 id="pageTitle">What's up first</h1>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="Shift settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
    </div>
    <p class="sub" id="dateLine"></p>
    <div class="tabs">
      <button class="tab active" id="tabPrep">Prep Rail</button>
      <button class="tab" id="tabShift">Next Shift</button>
      <button class="tab" id="tabAgent">Agent</button>
    </div>
  </header>

  <main id="view-prep">
    <div id="list"></div>
    <div class="excluded-block" id="excludedBlock"></div>
  </main>

  <main id="view-shift" class="hidden"></main>

  <main id="view-agent" class="hidden"></main>

  <footer id="footerPrep">
    <button id="endshift">End of shift check</button>
  </footer>
</div>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="sidebar" id="sidebar">
  <h2>Shift settings</h2>
  <p class="sub-label">Set how long a shift runs so the app knows when one ends and the next begins.</p>

  <div class="sidebar-section">
    <div class="current-shift-box" id="currentShiftBox"></div>

    <div class="field-row">
      <div class="field-col">
        <label for="shiftStartInput">Shift start</label>
        <input type="datetime-local" id="shiftStartInput">
      </div>
      <div class="field-col">
        <label for="shiftDurationInput">Duration (hrs)</label>
        <input type="number" id="shiftDurationInput" min="1" max="16" step="0.5">
      </div>
    </div>

    <button id="startShiftBtn">Start new shift now</button>
  </div>

  <div class="sidebar-section">
    <h2 style="font-size:13px;">Shift history</h2>
    <p class="sub-label">Use this to test the app as different workers across several shifts.</p>
    <div id="historyList"></div>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2>Was this done?</h2>
    <p>These items were never checked off today.</p>
    <div id="modalList"></div>
    <div class="signoff">
      <label for="signoffName">Your name, confirming the above is accurate</label>
      <input type="text" id="signoffName" placeholder="e.g. Jordan P.">
      <p class="signoff-hint" id="signoffHint"></p>
      <button id="signoffBtn" disabled>Sign off on this shift</button>
      <p class="signoff-confirmed" id="signoffConfirmed"></p>
    </div>
    <button class="modal-close" id="modalClose">Close</button>
  </div>
</div>

<script>
  const MAX_LOOKAHEAD_DAYS = 3;

  // PLACEHOLDER inventory estimates — real current-stock and days-to-stockout
  // figures should come from the kitchen's own tracking / the cook's input.
  // Item names and categories are the real recipe list; the numbers are
  // illustrative only, so this demo can be clicked through end to end.
  const ITEMS = [
    // Sauces & Condiments
    { name: "Bacon Aioli",              current: 1, expected: 4,  daysToStockout: 2 },
    { name: "Chipotle Aioli",           current: 2, expected: 4,  daysToStockout: 3 },
    { name: "Jalapeño Aioli",           current: 1, expected: 3,  daysToStockout: 2 },
    { name: "Lime Crema",               current: 2, expected: 5,  daysToStockout: 3 },
    { name: "Remoulade",                current: 3, expected: 4,  daysToStockout: 4 },
    { name: "Ranch",                    current: 2, expected: 5,  daysToStockout: 3 },
    { name: "Marinara Sauce",           current: 4, expected: 10, daysToStockout: 2 },
    { name: "Brown Gravy",              current: 1, expected: 6,  daysToStockout: 1 },
    { name: "White Gravy",              current: 2, expected: 6,  daysToStockout: 2 },
    { name: "Jalapeño Jam",             current: 3, expected: 4,  daysToStockout: 5 },
    { name: "Maple Vinaigrette",        current: 2, expected: 5,  daysToStockout: 4 },
    // Salsas & Dips
    { name: "Guacamole",                current: 1, expected: 8,  daysToStockout: 1 },
    { name: "Pico de Gallo",            current: 3, expected: 10, daysToStockout: 1 },
    { name: "Queso",                    current: 2, expected: 6,  daysToStockout: 2 },
    { name: "Red Salsa",                current: 4, expected: 12, daysToStockout: 2 },
    // Proteins
    { name: "Crab Cakes",               current: 6, expected: 24, daysToStockout: 2 },
    { name: "Meatballs",                current: 10, expected: 40, daysToStockout: 3 },
    // Starches & Sides
    { name: "Smooth Gold Mashed Potatoes", current: 2, expected: 13, daysToStockout: 1 },
    { name: "Refried Beans",            current: 1, expected: 3,  daysToStockout: 3 },
    { name: "Dirty Rice Mix",           current: 3, expected: 8,  daysToStockout: 4 },
    { name: "Summer Vegetable Medley",  current: 2, expected: 6,  daysToStockout: 2 },
    // Breakfast
    { name: "French Toast Batter",      current: 2, expected: 6,  daysToStockout: 3 },
    { name: "Apple Compote",            current: 2, expected: 5,  daysToStockout: 4 },
    // Breading / Batters / Dry Mixes
    { name: "Chicken Parmesan Breading", current: 4, expected: 12, daysToStockout: 5 },
    { name: "Beer Batter",              current: 2, expected: 4,  daysToStockout: 2 },
    { name: "Seasoned Flour",           current: 3, expected: 6,  daysToStockout: 6 },
    { name: "Sweet Potato Fry Seasoning", current: 4, expected: 5, daysToStockout: 7 },
    { name: "Croutons",                 current: 3, expected: 8,  daysToStockout: 3 },
    // Fruit
    { name: "Fruit Cups",               current: 5, expected: 20, daysToStockout: 1 },
  ];

  function urgencyScore(item) {
    const shortage = (item.expected - item.current) / item.expected;
    const time = 1 / item.daysToStockout;
    return shortage + time;
  }

  function level(score) {
    if (score >= 1.3) return "high";
    if (score >= 0.7) return "med";
    return "low";
  }

  function loadState() {
    try {
      const raw = localStorage.getItem("prepRailState");
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveState(state) {
    try { localStorage.setItem("prepRailState", JSON.stringify(state)); }
    catch (e) { /* storage unavailable, continue without persistence */ }
  }

  let state = loadState();

  // Approved agent adjustments override an item's base numbers.
  state.adjustments = state.adjustments || {};
  state.adjustLog = state.adjustLog || [];

  function effective(item) {
    const a = state.adjustments[item.name];
    return a
      ? { ...item, expected: a.expected, daysToStockout: a.days, adjusted: true }
      : item;
  }

  let inWindow = [];
  let excluded = [];
  function computeLists() {
    const eff = ITEMS.map(effective);
    inWindow = eff.filter(i => i.daysToStockout <= MAX_LOOKAHEAD_DAYS)
      .map(i => ({ ...i, score: urgencyScore(i) }))
      .sort((a, b) => b.score - a.score);
    excluded = eff.filter(i => i.daysToStockout > MAX_LOOKAHEAD_DAYS);
  }
  computeLists();

  const list = document.getElementById("list");

  function render() {
    list.innerHTML = "";
    inWindow.forEach(item => {
      const key = item.name;
      const checked = !!state[key]?.checked;
      const note = state[key]?.note || "";
      const lvl = level(item.score);

      const ticket = document.createElement("div");
      ticket.className = `ticket level-${lvl}${checked ? " checked" : ""}`;

      ticket.innerHTML = `
        <button class="check" aria-label="Mark ${item.name} done">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <div class="ticket-body">
          <div class="row-top">
            <span class="item-name">${item.name}</span>
            <span class="score-tag">${item.score.toFixed(2)}</span>
          </div>
          <p class="reason">${item.current}/${item.expected} in stock · ${item.daysToStockout}d to stockout${item.adjusted ? ' · <span class="tag-adjusted">adjusted</span>' : ""}</p>
          <button class="note-toggle" type="button">${note ? "Edit note" : "Log an adjustment"}</button>
          <div class="note-field">
            <textarea rows="2" placeholder="What changed from the suggested order?">${note}</textarea>
          </div>
          <p class="note-saved">Saved.</p>
        </div>
      `;

      ticket.querySelector(".check").addEventListener("click", () => {
        state[key] = state[key] || {};
        state[key].checked = !state[key].checked;
        saveState(state);
        render();
        renderShift();
      });

      const noteToggle = ticket.querySelector(".note-toggle");
      const noteField = ticket.querySelector(".note-field");
      const textarea = ticket.querySelector("textarea");
      const savedLabel = ticket.querySelector(".note-saved");

      noteToggle.addEventListener("click", () => {
        noteField.classList.toggle("open");
      });
      textarea.addEventListener("blur", () => {
        state[key] = state[key] || {};
        state[key].note = textarea.value.trim();
        saveState(state);
        if (state[key].note) {
          savedLabel.classList.add("show");
          noteToggle.textContent = "Edit note";
          setTimeout(() => savedLabel.classList.remove("show"), 1500);
        }
        renderShift();
      });

      list.appendChild(ticket);
    });
  }

  const excludedBlock = document.getElementById("excludedBlock");
  function renderExcluded() {
    excludedBlock.style.display = excluded.length ? "" : "none";
    excludedBlock.innerHTML = excluded.length
      ? `<b>Not yet — more than ${MAX_LOOKAHEAD_DAYS} days out:</b><br>` +
        excluded.map(i => `${i.name} (${i.daysToStockout}d)`).join(" · ")
      : "";
  }

  // ---- Shift configuration & history ----
  function initShiftConfig() {
    if (!state.shiftConfig) {
      state.shiftConfig = { durationHours: 8, shiftStart: new Date().toISOString() };
    }
    if (!state.shiftNumber) state.shiftNumber = 1;
    if (!state.shiftHistory) state.shiftHistory = [];
  }
  initShiftConfig();

  function shiftEndTime() {
    const start = new Date(state.shiftConfig.shiftStart);
    return new Date(start.getTime() + state.shiftConfig.durationHours * 3600000);
  }
  function fmtDateTime(d) {
    return d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  }
  function toInputValue(d) {
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }
  function updateDateLine() {
    const base = new Date().toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
    document.getElementById("dateLine").textContent = `${base} · Shift #${state.shiftNumber}`;
  }
  updateDateLine();

  const shiftStartInput = document.getElementById("shiftStartInput");
  const shiftDurationInput = document.getElementById("shiftDurationInput");
  const currentShiftBox = document.getElementById("currentShiftBox");
  const historyList = document.getElementById("historyList");

  function renderSidebar() {
    const start = new Date(state.shiftConfig.shiftStart);
    const end = shiftEndTime();
    const overdue = new Date() > end;

    currentShiftBox.innerHTML = `
      <b>Shift #${state.shiftNumber}</b><br>
      Started ${fmtDateTime(start)}<br>
      Ends ${fmtDateTime(end)} (${state.shiftConfig.durationHours}h)
      ${overdue ? `<br><span class="overdue-flag">Shift duration has elapsed — start the next shift when ready.</span>` : ""}
    `;
    shiftStartInput.value = toInputValue(start);
    shiftDurationInput.value = state.shiftConfig.durationHours;

    historyList.innerHTML = state.shiftHistory.length
      ? state.shiftHistory.slice().reverse().map(h => `
          <div class="history-row">
            <div class="h-top"><span>Shift #${h.shiftNumber}</span><span>${h.completed}/${h.completed + h.open} done</span></div>
            <div class="h-meta">${fmtDateTime(new Date(h.start))} – ${fmtDateTime(new Date(h.end))}</div>
            <div class="h-meta">${h.signoff ? `Signed off: ${h.signoff.name}` : "Not signed off"}</div>
          </div>
        `).join("")
      : `<p class="history-empty">No completed shifts yet.</p>`;
  }

  shiftStartInput.addEventListener("change", () => {
    const d = new Date(shiftStartInput.value);
    if (!isNaN(d)) {
      state.shiftConfig.shiftStart = d.toISOString();
      saveState(state);
      renderSidebar();
      updateDateLine();
    }
  });
  shiftDurationInput.addEventListener("change", () => {
    const v = parseFloat(shiftDurationInput.value);
    if (!isNaN(v) && v > 0) {
      state.shiftConfig.durationHours = v;
      saveState(state);
      renderSidebar();
    }
  });

  document.getElementById("startShiftBtn").addEventListener("click", () => {
    const completedNames = inWindow.filter(i => state[i.name]?.checked);
    const openNames = inWindow.filter(i => !state[i.name]?.checked);
    const notesList = inWindow.filter(i => state[i.name]?.note)
      .map(i => ({ item: i.name, note: state[i.name].note }));

    state.shiftHistory.push({
      shiftNumber: state.shiftNumber,
      start: state.shiftConfig.shiftStart,
      end: new Date().toISOString(),
      signoff: state._signoff || null,
      completed: completedNames.length,
      open: openNames.length,
      notes: notesList,
    });

    // Reset the working checklist for the next shift / next worker
    ITEMS.forEach(i => { delete state[i.name]; });
    delete state._signoff;
    state.shiftNumber += 1;
    state.shiftConfig.shiftStart = new Date().toISOString();

    saveState(state);
    render();
    renderShift();
    renderSidebar();
    updateDateLine();
  });

  // ---- Sidebar open/close ----
  const sidebar = document.getElementById("sidebar");
  const sidebarBackdrop = document.getElementById("sidebarBackdrop");
  document.getElementById("menuBtn").addEventListener("click", () => {
    renderSidebar();
    sidebar.classList.add("open");
    sidebarBackdrop.classList.add("open");
  });
  sidebarBackdrop.addEventListener("click", () => {
    sidebar.classList.remove("open");
    sidebarBackdrop.classList.remove("open");
  });

  // ---- Next Shift handoff view ----
  const viewShift = document.getElementById("view-shift");

  function renderShift() {
    const done = inWindow.filter(i => state[i.name]?.checked);
    const open = inWindow.filter(i => !state[i.name]?.checked);
    const notes = inWindow.filter(i => state[i.name]?.note);

    let html = `
      ${state._signoff ? `
        <div class="signoff-banner">
          Signed off by <b>${state._signoff.name}</b> · ${new Date(state._signoff.time).toLocaleString(undefined, { hour: 'numeric', minute: '2-digit', month: 'short', day: 'numeric' })}
        </div>
      ` : ""}
      <div class="summary-strip">
        <div class="summary-cell"><span class="num">${done.length}</span><span class="lbl">COMPLETED</span></div>
        <div class="summary-cell"><span class="num">${open.length}</span><span class="lbl">STILL OPEN</span></div>
        <div class="summary-cell"><span class="num">${notes.length}</span><span class="lbl">NOTES</span></div>
      </div>

      <p class="section-label">COMPLETED THIS SHIFT</p>
    `;
    html += done.length
      ? done.map(i => `
          <div class="handoff-row done">
            <span class="name">${i.name}</span>
            <span class="meta">brought up to ${i.expected} target</span>
            ${state[i.name]?.note ? `<span class="note">${state[i.name].note}</span>` : ""}
          </div>
        `).join("")
      : `<p class="handoff-empty">Nothing checked off yet.</p>`;

    html += `<p class="section-label">STILL NEEDS DOING</p>`;
    html += open.length
      ? open.map(i => `
          <div class="handoff-row open">
            <span class="name">${i.name}</span>
            <span class="meta">${i.current}/${i.expected} in stock · ${i.daysToStockout}d to stockout</span>
            ${state[i.name]?.note ? `<span class="note">${state[i.name].note}</span>` : ""}
          </div>
        `).join("")
      : `<p class="handoff-empty">Everything on today's rail is done.</p>`;

    if (excluded.length) {
      html += `<p class="section-label">COMING UP (BEYOND TODAY'S WINDOW)</p>`;
      html += excluded.map(i => `
        <div class="handoff-row">
          <span class="name">${i.name}</span>
          <span class="meta">${i.current}/${i.expected} in stock · ${i.daysToStockout}d to stockout</span>
        </div>
      `).join("");
    }

    if (state.shiftHistory && state.shiftHistory.length) {
      const last = state.shiftHistory[state.shiftHistory.length - 1];
      html += `<p class="section-label">PREVIOUS SHIFT (#${last.shiftNumber})</p>`;
      html += `
        <div class="handoff-row done">
          <span class="name">${last.completed}/${last.completed + last.open} items completed</span>
          <span class="meta">${last.signoff ? `Signed off by ${last.signoff.name}` : "Not signed off"}</span>
        </div>
      `;
    }

    viewShift.innerHTML = html;
  }

  renderExcluded();
  render();
  renderShift();

  // ---- Tabs ----
  const viewPrep = document.getElementById("view-prep");
  const viewAgent = document.getElementById("view-agent");
  const footerPrep = document.getElementById("footerPrep");
  const pageTitle = document.getElementById("pageTitle");
  const kicker = document.querySelector(".kicker");

  const TABS = {
    prep:  { tab: "tabPrep",  view: viewPrep,  footer: true,  kicker: "TODAY · PREP RAIL",        title: "What's up first" },
    shift: { tab: "tabShift", view: viewShift, footer: false, kicker: "HANDOFF · AFTERNOON SHIFT", title: "Next shift list" },
    agent: { tab: "tabAgent", view: viewAgent, footer: false, kicker: "AGENT",                    title: "Notes and customers" },
  };
  function showTab(name) {
    Object.entries(TABS).forEach(([key, t]) => {
      const on = key === name;
      document.getElementById(t.tab).classList.toggle("active", on);
      t.view.classList.toggle("hidden", !on);
    });
    footerPrep.classList.toggle("hidden", !TABS[name].footer);
    kicker.textContent = TABS[name].kicker;
    pageTitle.textContent = TABS[name].title;
    if (name === "shift") renderShift();
    if (name === "agent") renderAgent();
  }
  Object.entries(TABS).forEach(([key, t]) => {
    document.getElementById(t.tab).addEventListener("click", () => showTab(key));
  });

  // ---- End-of-shift check ----
  const backdrop = document.getElementById("modalBackdrop");
  const modalList = document.getElementById("modalList");
  const signoffName = document.getElementById("signoffName");
  const signoffBtn = document.getElementById("signoffBtn");
  const signoffConfirmed = document.getElementById("signoffConfirmed");

  function renderSignoffBlock() {
    const existing = state._signoff;
    if (existing) {
      signoffName.style.display = "none";
      signoffBtn.style.display = "none";
      signoffConfirmed.textContent =
        `Signed off by ${existing.name} · ${new Date(existing.time).toLocaleString(undefined, { hour: 'numeric', minute: '2-digit', month: 'short', day: 'numeric' })}`;
      signoffConfirmed.classList.add("show");
    } else {
      signoffName.style.display = "";
      signoffBtn.style.display = "";
      signoffName.value = "";
      signoffBtn.disabled = true;
      signoffConfirmed.classList.remove("show");
      updateSignoffState();
    }
  }

  const signoffHint = document.getElementById("signoffHint");

  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Sign-off needs a name AND a reason (note) on every item still unchecked.
  function updateSignoffState() {
    const missing = inWindow.filter(i =>
      !state[i.name]?.checked && !(state[i.name]?.note || "").trim());
    const nameOk = signoffName.value.trim().length > 0;
    signoffBtn.disabled = !(nameOk && missing.length === 0);
    if (missing.length) {
      signoffHint.textContent =
        `Add a reason for ${missing.length} unfinished item${missing.length > 1 ? "s" : ""} to sign off.`;
      signoffHint.classList.add("show");
    } else {
      signoffHint.classList.remove("show");
    }
    modalList.querySelectorAll("textarea[data-name]").forEach(t => {
      t.classList.toggle("needs-note", !t.value.trim());
    });
  }

  signoffName.addEventListener("input", updateSignoffState);

  signoffBtn.addEventListener("click", () => {
    const name = signoffName.value.trim();
    if (!name) return;
    state._signoff = { name, time: new Date().toISOString() };
    saveState(state);
    renderSignoffBlock();
    renderShift();
  });

  document.getElementById("endshift").addEventListener("click", () => {
    const unfinished = inWindow.filter(i => !state[i.name]?.checked);
    modalList.innerHTML = unfinished.length
      ? unfinished.map(i => `
          <div class="modal-item">
            <span>${i.name}</span>
            <button data-name="${i.name}">Mark done</button>
            <textarea rows="2" data-name="${i.name}"
              placeholder="Why wasn't this finished? (required to sign off)">${escapeHtml(state[i.name]?.note || "")}</textarea>
          </div>
        `).join("")
      : `<p class="all-done">Everything on today's list is checked off.</p>`;

    modalList.querySelectorAll("button[data-name]").forEach(btn => {
      btn.addEventListener("click", () => {
        const name = btn.getAttribute("data-name");
        state[name] = state[name] || {};
        state[name].checked = true;
        saveState(state);
        render();
        renderShift();
        btn.closest(".modal-item").remove();
        if (!modalList.querySelector(".modal-item")) {
          modalList.innerHTML = `<p class="all-done">Everything on today's list is checked off.</p>`;
        }
        updateSignoffState();
      });
    });

    modalList.querySelectorAll("textarea[data-name]").forEach(t => {
      t.addEventListener("input", () => {
        const name = t.getAttribute("data-name");
        state[name] = state[name] || {};
        state[name].note = t.value.trim();
        saveState(state);
        render();
        renderShift();
        updateSignoffState();
      });
    });

    renderSignoffBlock();
    backdrop.classList.add("open");
  });
  document.getElementById("modalClose").addEventListener("click", () => {
    backdrop.classList.remove("open");
  });

  // =====================================================================
  // Note-reading agent
  //
  // Reads the cooks' free-text notes and PROPOSES changes to an item's
  // target level and days-to-stockout. A cook approves every change; the
  // urgency math itself stays plain arithmetic. Claude is reached through
  // the artifact's built-in "sample" capability, so there is no API key
  // in this page. If Claude is unavailable, simple keyword rules are used.
  // =====================================================================

  // BEGIN-PURE
  const MAX_EXPECTED_SWING_PCT = 25;   // a single approval can move the target by at most +/-25%
  const MAX_DAYS_SWING = 1;            // ...and days-to-stockout by at most 1 day

  function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }

  // Fallback used when Claude can't be reached.
  function keywordSuggestion(note) {
    const low = String(note).toLowerCase();
    const shortRx = /ran (out|short|low)|\b86(ed|'d)?\b|out of (stock|it)|not enough|needed (way )?more|sold out|ran dry/;
    const surplusRx = /too much|left ?over|plenty left|used less|threw (out|away)|thrown out|wasted|extra .*(left|remaining)|didn'?t (need|use)/;
    const isShort = shortRx.test(low);
    const isSurplus = surplusRx.test(low);
    if (isShort && !isSurplus) {
      return { signal: "ran_short", expected_change_pct: 15, days_change: -1,
               reason: "Note mentions running short or out." };
    }
    if (isSurplus && !isShort) {
      return { signal: "surplus", expected_change_pct: -10, days_change: 1,
               reason: "Note mentions leftover or unused product." };
    }
    return { signal: "unclear", expected_change_pct: 0, days_change: 0,
             reason: "No clear shortage or surplus in this note." };

  // Never trust model output: coerce, clamp, and force direction to match the signal.
  function normalizeSuggestion(raw, item) {
    const signals = ["ran_short", "surplus", "no_change", "unclear"];
    const signal = signals.includes(raw && raw.signal) ? raw.signal : "unclear";
    let pct = Math.round(Number(raw && raw.expected_change_pct));
    let dd = Math.round(Number(raw && raw.days_change));
    if (!isFinite(pct)) pct = 0;
    if (!isFinite(dd)) dd = 0;
    pct = clamp(pct, -MAX_EXPECTED_SWING_PCT, MAX_EXPECTED_SWING_PCT);
    dd = clamp(dd, -MAX_DAYS_SWING, MAX_DAYS_SWING);
    if (signal === "ran_short") { pct = Math.max(pct, 0); dd = Math.min(dd, 0); }
    else if (signal === "surplus") { pct = Math.min(pct, 0); dd = Math.max(dd, 0); }
    else { pct = 0; dd = 0; }
    const newExpected = Math.max(1, Math.round(item.expected * (1 + pct / 100)));
    const newDays = clamp(item.daysToStockout + dd, 1, 7);
    return {
      signal,
      pct,
      dd,
      newExpected,
      newDays,
      reason: String((raw && raw.reason) || "").slice(0, 160),
      changes: newExpected !== item.expected || newDays !== item.daysToStockout,
    };
  }

  // =====================================================================
  // Customer agent
  //
  // The kitchen has no customer data of its own, so cooks log a daily

  // BEGIN-PURE
  const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const WEEK_ORDER = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

  function dateKey(d) {
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function todayKey() { return dateKey(new Date()); }

  // "2026-10-13" -> Date at noon local time, or null if it isn't a real date.
  function parseDateKey(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
    if (!m) return null;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 12, 0, 0);
    if (d.getFullYear() !== Number(m[1]) || d.getMonth() !== Number(m[2]) - 1 || d.getDate() !== Number(m[3])) return null;
    return d;
  }
  function weekdayOf(s) {
    const d = parseDateKey(s);
    return d ? WEEKDAYS[d.getDay()] : null;
  }

  // Returns an error message, or null when the entry is fine.
  function validateCount(dateStr, customersRaw, todayStr) {
    if (!parseDateKey(dateStr)) return "Pick a valid date.";
    if (dateStr > todayStr) return "Counts are for days that already happened. Pick today or an earlier date.";
    const raw = String(customersRaw).trim();
    if (!/^\d+$/.test(raw)) return "Enter the number of customers as a whole number.";
    if (Number(raw) > 5000) return "That looks too high. Enter the customers for one day.";
    return null;
  }

  function summarizeCustomers(log) {
    const acc = {};
    WEEKDAYS.forEach(w => { acc[w] = { n: 0, sum: 0, min: null, max: null }; });
    let total = 0, count = 0;
    (log || []).forEach(e => {
      const w = e && weekdayOf(e.date);
      const c = e && Number(e.customers);
      if (!w || !Number.isFinite(c)) return;
      const b = acc[w];
      b.n++; b.sum += c;
      b.min = b.min === null ? c : Math.min(b.min, c);
      b.max = b.max === null ? c : Math.max(b.max, c);
      total += c; count++;
    });
    const byWeekday = {};
    WEEKDAYS.forEach(w => {
      const b = acc[w];
      byWeekday[w] = { days: b.n, avg: b.n ? Math.round(b.sum / b.n) : null, min: b.min, max: b.max };
    });
    return { daysLogged: count, overallAvg: count ? Math.round(total / count) : null, byWeekday };
  }

  // What the cook sees when Claude can't be reached: the plain numbers.
  function fallbackAnswer(summary) {
    const lines = WEEK_ORDER.map(w => {
      const b = summary.byWeekday[w];
      return b.days
        ? `${w}: average ${b.avg} (range ${b.min}–${b.max}), ${b.days} day${b.days > 1 ? "s" : ""} logged`
        : `${w}: no counts yet`;
    });
    return "Here is what your log shows:\n" + lines.join("\n");
  }

  // Made-up sample numbers so the agent can be tried before real counts exist.
  function demoCounts(todayStr, days) {
    const base = { Sunday: 160, Monday: 60, Tuesday: 65, Wednesday: 70, Thursday: 85, Friday: 140, Saturday: 190 };
    const t = parseDateKey(todayStr);
    const out = [];
    for (let i = days; i >= 1; i--) {
      const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() - i, 12, 0, 0);
      const wobble = ((i * 7) % 11 - 5) * 2;   // -10..+10, repeatable
      out.push({ id: "demo-" + dateKey(d), date: dateKey(d), customers: base[WEEKDAYS[d.getDay()]] + wobble, note: "", demo: true });
    }

  // ---- Rain forecast logic ----
  // The reminder shows only when the chance is STRICTLY above 65.
  const RAIN_REMINDER_PCT = 65;
  function rainOver(pct) { return Number.isFinite(pct) && pct > RAIN_REMINDER_PCT; }

  // The reminder sentence, or "" when no day is over the threshold.
  function rainReminderLine(days) {
    const high = (days || []).filter(d => d && rainOver(d.pct));
    return high.length
      ? `Reminder: the chance of rain is over ${RAIN_REMINDER_PCT}% ${high.map(d => d.label.toLowerCase()).join(" and ")}, so orders might be less than normal.`
      : "";

  // days: [{label:"Today", pct:70}, ...]. Returns plain text for the cook.
  function describeRain(days, sourceText) {
    const valid = (days || []).filter(d => d && Number.isFinite(d.pct));
    if (!valid.length) {
      return "I don't have a rain forecast right now. Tap Refresh forecast, or type today's chance of rain into the Rain forecast box.";
    }

  function mentionsRain(q) { return RAIN_WORDS.test(String(q)); }
  // A question that is only about the forecast needs no customer data.
  function isRainOnly(q) { return mentionsRain(q) && !MIXED_WORDS.test(String(q)); }

  // Reads Open-Meteo's daily rain chances. Returns [{label,pct}] or null.
  function parseForecast(json) {
    const arr = json && json.daily && json.daily.precipitation_probability_max;
    if (!Array.isArray(arr) || !arr.length) return null;
    const labels = ["Today", "Tomorrow"];
    const days = arr.slice(0, 2).map((v, i) => ({
      label: labels[i],
      pct: (v === null || v === undefined || v === "") ? NaN : Number(v),
    }));
    return days.some(d => Number.isFinite(d.pct)) ? days : null;
  }

  function parsePct(raw) {

    const n = Number(s);
    return n <= 100 ? n : NaN;

  state.customerLog = state.customerLog || [];

  // ---- Rain forecast (free Open-Meteo API, no key needed) ----
  const KITCHEN = { name: "Spring Branch, TX", lat: 29.8766, lon: -98.3875, tz: "America/Chicago" };
  let weather = { status: "idle", days: [] };   // idle | loading | ok | unavailable
  let weatherPromise = null;

  function fetchWeather() {
    if (weatherPromise && weather.status === "loading") return weatherPromise;
    weather = { status: "loading", days: [] };
    paintRain();
    weatherPromise = (async () => {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 8000);
      try {
        const url = "https://api.open-meteo.com/v1/forecast?latitude=" + KITCHEN.lat +
          "&longitude=" + KITCHEN.lon + "&daily=precipitation_probability_max&forecast_days=2&timezone=" +
          encodeURIComponent(KITCHEN.tz);
        const r = await fetch(url, { signal: ctl.signal });
        if (!r.ok) throw new Error("http " + r.status);
        const days = parseForecast(await r.json());
        if (!days) throw new Error("no data");
        weather = { status: "ok", days };
      } catch (e) {
        weather = { status: "unavailable", days: [] };
      } finally {
        clearTimeout(timer);
      }
      paintRain();
    })();
    return weatherPromise;
  }

  // Live forecast if we have it, otherwise what the cook typed today.
  function currentForecast() {
    if (weather.status === "ok") return { days: weather.days, source: "Open-Meteo forecast for " + KITCHEN.name };
    const m = state.weatherManual;
    if (m && m.date === todayKey()) {
      const days = [];
      if (Number.isFinite(m.today)) days.push({ label: "Today", pct: m.today });
      if (Number.isFinite(m.tomorrow)) days.push({ label: "Tomorrow", pct: m.tomorrow });

        : "no customer counts logged yet") + `</div>`;

  function paintRain() {

      return `<div class="bubble ${m.role}"><span class="who">${who}</span>${body}</div>`;
    }).join("");
    el.lastElementChild && el.lastElementChild.scrollIntoView({ block: "nearest" });
  }

  async function askCustomers(question) {
    const q = String(question || "").trim().slice(0, 300);
    if (!q || custBusy) return;
    const box = document.getElementById("custQ");
    if (box) box.value = "";

    const userMsg = { role: "user", text: q };
    custMsgs.push(userMsg);
    const reply = { role: "assistant", text: "", pending: true };
    custMsgs.push(reply);
    custBusy = true;
    renderAgent();

    const summary = summarizeCustomers(state.customerLog);

    // Wait briefly for a forecast that is still loading.
    if (mentionsRain(q) && weatherPromise && weather.status === "loading") await weatherPromise;

    const rainOnly = isRainOnly(q);
    // One agent for customers and rain. Claude answers both; the page only
    // answers alone when Claude is missing, or there is nothing to ask it.
    if (!sampleFn || (!state.customerLog.length && !mentionsRain(q))) {
      reply.text = localAnswer(q, summary);
      reply.local = true;
      reply.label = rainOnly ? "forecast" : "from your log";
    } else {
      // Claude remembers nothing between calls, so the page sends the data
      // and the recent conversation every time.
      const turns = custMsgs
        .filter(m => !m.pending && !m.local && m.text)
        .slice(-7)
        .map(m => ({ role: m.role, content: m.text }));
      while (turns.length && turns[0].role !== "user") turns.shift();
      custCtl = new AbortController();
      try {
        const res = await sampleFn(
          [{ role: "user", content: buildCustomerPrompt() }, ...turns],
          {
            cache: false,
            modelTier: "quick",
            signal: custCtl.signal,
            onText: ({ text }) => { reply.text = text; renderCustLog(); },
          }
        );
        reply.text = res.text;
        // The reminder must never depend on the model remembering it.
        if (mentionsRain(q)) {
          const rem = rainReminderLine(currentForecast().days);
          if (rem && !/less than normal/i.test(reply.text)) reply.text += "\n\n" + rem;
        }
      } catch (e) {
        if (e && e.code === "cancelled") {
          reply.text = (e.text || "").trim() || "Stopped.";
        } else {
          const why = CUST_ERROR_COPY[e && e.code] || "Claude couldn't be reached.";
          reply.text = why + "\n\n" + localAnswer(q, summary);
          reply.local = true;
          reply.label = "from your log";
        }
      }
      custCtl = null;
    }

    reply.pending = false;
    // A question answered without Claude stays out of what Claude is sent
    // next time, so it can't be mistaken for a second, unanswered question.
    if (reply.local) userMsg.local = true;
    custBusy = false;
    renderAgent();
  }

  function addCount() {
    const date = document.getElementById("custDate").value;
    const num = document.getElementById("custNum").value;
    const note = document.getElementById("custNote").value.trim().slice(0, 80);
    const err = validateCount(date, num, todayKey());
    if (err) { custFormMsg = err; custFormErr = true; renderAgent(); return; }
    // One count per day: a new entry replaces the old one for that date.
    state.customerLog = state.customerLog.filter(e => e.date !== date);
    state.customerLog.push({ id: "c" + Date.now() + Math.floor(Math.random() * 1000), date, customers: Number(num), note, demo: false });
    saveState(state);
    custFormMsg = `Saved ${weekdayOf(date)} ${date}.`;
    custFormErr = false;
    renderAgent();
  }
  function deleteCount(id) {
    state.customerLog = state.customerLog.filter(e => e.id !== id);
    saveState(state);
    renderAgent();
  }
  function loadDemo() {
    const real = new Set(state.customerLog.map(e => e.date));
    state.customerLog = state.customerLog.concat(demoCounts(todayKey(), 28).filter(e => !real.has(e.date)));
    saveState(state);
    custFormMsg = "Demo counts loaded. These are made-up sample numbers.";
    custFormErr = false;
    renderAgent();
  }
  function clearDemo() {
    state.customerLog = state.customerLog.filter(e => !e.demo);
    saveState(state);
    custFormMsg = "Demo counts removed.";
    custFormErr = false;
    renderAgent();
  }

  function renderCustomersPane() {
    const today = todayKey();
    const summary = summarizeCustomers(state.customerLog);
    const hasDemo = state.customerLog.some(e => e.demo);

    let statusCls = "agent-status";
    let statusText;
    if (!sampleChecked) {
      statusText = "Checking whether Claude is available…";
    } else if (sampleFn) {
      statusCls += " live";
      statusText = "Claude is connected. It answers from the counts you log and the rain forecast. The first question asks your permission.";
    } else {
      statusCls += " fallback";
      statusText = "Claude isn't available here, so questions are answered with the plain averages from your log and the forecast.";
    }

    let html = `<div class="${statusCls}">${statusText}</div>`;

    html += `<p class="section-label">OUTLOOK · ${escapeHtml(KITCHEN.name.toUpperCase())}</p>
      <div id="outlookCard"></div>
      <div id="rainCard"></div>
      <button class="wide-btn ghost" data-action="refresh-weather">Refresh forecast</button>

      <p class="section-label">ASK ABOUT CUSTOMERS &amp; RAIN</p>
      <div class="chat-log" id="custLog"></div>
      <div class="chat-input">
        <textarea id="custQ" rows="2" maxlength="300" placeholder="e.g. How many customers on Saturday? Will it rain?"></textarea>
        ${custBusy
          ? `<button class="wide-btn ghost" data-action="stop">Stop</button>`
          : `<button class="wide-btn" data-action="ask">Ask</button>`}
        <div class="chips">${CUSTOMER_CHIPS.map(c =>
          `<button data-action="chip" data-q="${escapeHtml(c)}" ${custBusy ? "disabled" : ""}>${escapeHtml(c)}</button>`).join("")}</div>
      </div>

      <p class="section-label">RAIN CHANCE BY HAND</p>
      <div class="field-row">
        <div class="field-col"><label for="rainToday">Today %</label>
          <input type="number" id="rainToday" min="0" max="100" step="1" inputmode="numeric" placeholder="by hand"></div>
        <div class="field-col"><label for="rainTomorrow">Tomorrow %</label>
          <input type="number" id="rainTomorrow" min="0" max="100" step="1" inputmode="numeric" placeholder="by hand"></div>
      </div>
      <p class="form-msg">If the forecast can't load, type the chance of rain here. It is used for today only.</p>`;

    html += `<p class="section-label">LOG A DAY'S CUSTOMERS</p>
      <div class="count-form">
        <div class="field-row">
          <div class="field-col"><label for="custDate">Date</label>
            <input type="date" id="custDate" value="${today}" max="${today}"></div>
          <div class="field-col"><label for="custNum">Customers</label>
            <input type="number" id="custNum" min="0" max="5000" step="1" inputmode="numeric" placeholder="e.g. 120"></div>
        </div>
        <input type="text" class="count-note" id="custNote" maxlength="80" placeholder="Note (optional): member event, slow after a storm…">
        <button class="wide-btn" data-action="add-count">Save count</button>
        <p class="form-msg ${custFormErr ? "err" : ""}">${escapeHtml(custFormMsg)}</p>
      </div>`;

    html += `<p class="section-label">WHAT THE AGENT SEES</p>`;
    if (!summary.daysLogged) {
      html += `<p class="handoff-empty">No counts logged yet.</p>`;
    } else {
      html += `<table class="count-table"><tr><th>Day</th><th class="num">Days</th><th class="num">Average</th><th class="num">Range</th></tr>` +
        WEEK_ORDER.map(w => {
          const b = summary.byWeekday[w];
          return b.days
            ? `<tr><td>${w}</td><td class="num">${b.days}</td><td class="num">${b.avg}</td><td class="num">${b.min}–${b.max}</td></tr>`
            : `<tr><td>${w}</td><td class="num">0</td><td class="num">—</td><td class="num">—</td></tr>`;
        }).join("") + `</table>`;
    }

    if (!summary.daysLogged) {
      html += `<button class="wide-btn ghost" data-action="demo">Load 4 weeks of demo counts</button>
               <p class="form-msg">Demo counts are made-up sample numbers for trying the agent. Remove them any time.</p>`;
    } else if (hasDemo) {
      html += `<button class="wide-btn ghost" data-action="clear-demo">Remove demo counts</button>
               <p class="form-msg"><span class="demo-tag">Some entries are demo data</span> (made-up sample numbers).</p>`;
    }

    const recent = sortedLog().slice(0, 10);
    if (recent.length) {
      html += `<p class="section-label">RECENT COUNTS</p>` + recent.map(e => `
        <div class="count-row">
          <span>${escapeHtml(weekdayOf(e.date) || "")} ${escapeHtml(e.date)} · <b>${escapeHtml(e.customers)}</b>
            ${e.demo ? '<span class="demo-tag">demo</span>' : ""}
            ${e.note ? `<span class="c-note">${escapeHtml(e.note)}</span>` : ""}</span>
          <button data-action="del-count" data-name="${escapeHtml(e.id)}" aria-label="Delete count">Delete</button>
        </div>`).join("");
    }
    return html;
  }

  function renderAgent() {
    // Keep a half-typed question when the pane redraws.
    const oldBox = document.getElementById("custQ");
    const typed = oldBox ? oldBox.value : "";
    const switcher = `<div class="pane-switch">
        <button data-action="pane" data-name="notes" class="${agentPane === "notes" ? "active" : ""}">Notes</button>
        <button data-action="pane" data-name="customers" class="${agentPane === "customers" ? "active" : ""}">Customers &amp; rain</button>
      </div>`;
    viewAgent.innerHTML = switcher + (agentPane === "notes" ? renderNotesPane() : renderCustomersPane());
    if (agentPane === "customers") {
      const box = document.getElementById("custQ");
      if (box && typed) box.value = typed;
      renderCustLog();
      const m = state.weatherManual;
      if (m && m.date === todayKey()) {
        const t = document.getElementById("rainToday"), tm = document.getElementById("rainTomorrow");
        if (t && Number.isFinite(m.today)) t.value = m.today;
        if (tm && Number.isFinite(m.tomorrow)) tm.value = m.tomorrow;
      }
      paintRain();
      if (weather.status === "idle") fetchWeather();
    }
  }

  // By-hand rain chances. Only the forecast box redraws, so typing keeps focus.
  viewAgent.addEventListener("input", ev => {
    const id = ev.target && ev.target.id;
    if (id !== "rainToday" && id !== "rainTomorrow") return;
    const t = parsePct(document.getElementById("rainToday").value);
    const tm = parsePct(document.getElementById("rainTomorrow").value);
    state.weatherManual = {
      date: todayKey(),
      today: Number.isFinite(t) ? t : null,
      tomorrow: Number.isFinite(tm) ? tm : null,
    };
    saveState(state);
    paintRain();
  });

  viewAgent.addEventListener("click", ev => {
    const btn = ev.target.closest("button[data-action]");
    if (!btn) return;
    const name = btn.getAttribute("data-name");
    const action = btn.getAttribute("data-action");
    if (action === "read") runAgent();
    else if (action === "approve") approveSuggestion(name);
    else if (action === "dismiss") dismissSuggestion(name);
    else if (action === "reset") resetAdjustment(name);
    else if (action === "pane") { agentPane = name; renderAgent(); }
    else if (action === "ask") askCustomers(document.getElementById("custQ").value);
    else if (action === "chip") askCustomers(btn.getAttribute("data-q"));
    else if (action === "stop") { if (custCtl) custCtl.abort(); }
    else if (action === "add-count") addCount();
    else if (action === "del-count") deleteCount(name);
    else if (action === "demo") loadDemo();
    else if (action === "clear-demo") clearDemo();
    else if (action === "refresh-weather") fetchWeather();
  });

  renderAgent();
</script>
</body>
</html>
